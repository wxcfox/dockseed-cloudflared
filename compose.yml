name: dockseed-cloudflared

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    container_name: dockseed-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro
    extra_hosts:
      - "host.docker.internal=host-gateway"
    networks:
      - gateway

networks:
  gateway:
    name: ${GATEWAY_NETWORK:-dockseed-gateway}
    external: true
