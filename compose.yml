name: dockseed-cloudflared

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?请在 .env 中配置 CLOUDFLARED_IMAGE}
    restart: unless-stopped
    command:
      - tunnel
      - --protocol
      - ${CLOUDFLARED_PROTOCOL:-auto}
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro
    extra_hosts:
      - "host.docker.internal=host-gateway"
    networks:
      - gateway

networks:
  gateway:
    name: ${GATEWAY_NETWORK:?请在 .env 中配置 GATEWAY_NETWORK}
    external: true
